<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>접근 권한 없음 | 사이뱅크</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f7fa;
            color: #1b2737;
            font-family: -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
        }
        .box {
            background: #fff;
            padding: 55px 65px;
            text-align: center;
            border: 1px solid #e7ebf0;
            border-radius: 14px;
            max-width: 470px;
            width: calc(100% - 32px);
        }
        .symbol {
            width: 62px;
            height: 62px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #fcecec;
            color: #c84c4c;
            display: grid;
            place-items: center;
            font-size: 27px;
            font-weight: bold;
        }
        h1 { font-size: 23px; margin: 0 0 15px; }
        p {
            font-size: 14px;
            color: #84909e;
            line-height: 1.8;
            margin-bottom: 32px;
        }
        a {
            display: inline-block;
            padding: 13px 26px;
            background: #157a63;
            color: #fff;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 650;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="symbol">!</div>
    <h1>접근 권한이 없습니다</h1>
    <p>
        관리자 전용 페이지입니다.<br>
        해당 계정에는 접근 권한이 없습니다.
    </p>
    <a href="/home">사이뱅크 홈으로 돌아가기</a>
</div>
</body>
</html>
