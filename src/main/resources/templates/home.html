<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메인 · 사이원장 Mock Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" th:href="@{/css/home/home.css}"
          href="/css/home/home.css">
</head>
<body>
<header class="top-header">
    <nav class="breadcrumb">
        <a data-route="main" href="/home">메인</a>
    </nav>
    <div class="header-tools">
        <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input type="search" placeholder="검색어 입력">
        </label>
        <button class="icon-button notification-button" type="button" aria-label="알림">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span></span>
        </button>
        <strong id="header-user-name" class="header-user-name"></strong>
        <div class="header-profile">
            <img id="header-profile-image" alt="프로필 이미지" hidden>
            <svg id="header-profile-placeholder" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
        </div>
    </div>
</header>

<div class="page">
    <header class="page-header">
        <div class="brand">
            <span class="brand-mark">사이</span>
            <span class="brand-sub">MOCK BANK</span>
        </div>
        <h1>무엇을 도와드릴까요?</h1>
        <p class="page-desc">아래에서 원하는 기능을 선택하세요.</p>
    </header>

    <main class="action-grid">
        <a href="/transfer" class="action-card">
            <div class="action-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17 3v18"></path>
                    <path d="m22 8-5-5-5 5"></path>
                    <path d="M7 21V3"></path>
                    <path d="m2 16 5 5 5-5"></path>
                </svg>
            </div>
            <h2>계좌 이체</h2>
            <p>내 계좌에서 다른 계좌로 돈을 보냅니다.</p>
            <span class="action-cta">이체하러 가기 →</span>
        </a>

        <div class="action-card is-disabled" aria-disabled="true">
            <div class="action-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="6" width="18" height="13" rx="2"></rect>
                    <path d="M3 10h18"></path>
                    <path d="M7 15h.01"></path>
                </svg>
            </div>
            <h2>계좌 연동</h2>
            <p>계좌 연동은 <strong>사이원장</strong>에서 신청하면<br />
                이 화면으로 자동 연결됩니다.</p>
            <span class="action-cta action-cta-muted">사이원장에서 시작해주세요</span>
        </div>
    </main>
</div>

<script th:src="@{/js/home/home.js}" src="/js/home/home.js" defer></script>
</body>
</html>
