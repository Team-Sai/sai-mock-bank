<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사이뱅크 Mock Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" th:href="@{/css/common/header.css}"
          href="/css/common/header.css">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}"
          href="/css/common/footer.css">
    <link rel="stylesheet" th:href="@{/css/common/transaction-table.css}"
          href="/css/common/transaction-table.css">
    <link rel="stylesheet" th:href="@{/css/home/home.css}"
          href="/css/home/home.css">
</head>
<body>
<header th:replace="~{fragments/header :: header(activeRoute='home')}"></header>

<main class="page">
    <section class="balance-card">
        <div class="balance-card__body">
            <h2 class="balance-card__label">총 사용 가능 잔액</h2>
            <p class="balance-card__amount" id="balanceAmount">불러오는 중…</p>
        </div>
        <div class="balance-card__footer">
            <a href="/transfer" class="balance-card__cta">이체</a>
        </div>
    </section>

    <p id="accountCreationStatus" class="account-creation-status" role="status" aria-live="polite"></p>
    <dialog id="createAccountDialog" class="account-dialog" aria-labelledby="createAccountTitle">
        <h2 id="createAccountTitle">계좌 생성</h2>
        <form id="createAccountForm">
            <p>은행과 초기 금액을 입력해 본인 명의의 계좌를 생성하세요.</p>
            <label for="creationBankCode">은행</label>
            <select id="creationBankCode" name="bankCode">
                <option value="088">신한은행</option>
                <option value="004">국민은행</option>
                <option value="020">우리은행</option>
                <option value="CUSTOM">직접 입력</option>
            </select>
            <div id="customBankFields" hidden>
                <label for="creationBankName">은행명 직접 입력</label>
                <input id="creationBankName" name="bankName" maxlength="100" placeholder="은행명을 입력하세요" />
            </div>
            <label for="creationAccountName">계좌명</label>
            <input id="creationAccountName" name="accountName" value="입출금통장" maxlength="100" required />
            <label for="creationInitialBalance">초기 금액 (원)</label>
            <input id="creationInitialBalance" name="initialBalance" type="text" inputmode="decimal" pattern="[0-9]{1,17}(\.[0-9]{1,2})?" maxlength="20" placeholder="예: 100000" required />
            <p id="creationMessage" role="status" aria-live="polite"></p>
            <div class="account-dialog__actions">
                <button type="button" id="closeCreationDialog">닫기</button>
                <button type="submit" id="submitCreateAccount" class="balance-card__cta">생성하기</button>
            </div>
        </form>
        <section id="creationComplete" hidden>
            <p id="creationCompleteMessage"></p>
            <button type="button" id="closeCreationComplete" class="balance-card__cta">닫기</button>
        </section>
    </dialog>

    <section class="transactions">
        <div class="transactions__header">
            <h3 class="transactions__title">최근 거래 내역</h3>
            <a href="/transactions" class="transactions__more">
                전체 보기
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                </svg>
            </a>
        </div>

        <div class="tx2-table" role="table">
            <div class="tx2-row tx2-row--head" role="row">
                <div class="tx2-cell tx2-cell--date" role="columnheader">날짜</div>
                <div class="tx2-cell tx2-cell--detail" role="columnheader">거래 상세 (수취인 | 계좌번호)</div>
                <div class="tx2-cell tx2-cell--account" role="columnheader">내 계좌(은행명, 계좌번호)</div>
                <div class="tx2-cell tx2-cell--amount" role="columnheader">금액</div>
            </div>

            <!-- JS(home.js)가 fetch 결과로 이 안에 tx2-row를 동적으로 렌더링합니다 -->
            <div id="transactionsBody" class="tx2-body">
                <p class="tx2-state" id="transactionsState">불러오는 중…</p>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/js/common/transaction-utils.js}" src="/js/common/transaction-utils.js"></script>
<script th:src="@{/js/home/account-create.js}" src="/js/home/account-create.js" defer></script>
<script th:src="@{/js/home/home.js}" src="/js/home/home.js" defer></script>
</body>
</html>
