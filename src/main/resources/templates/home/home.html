<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메인 · 사이원장 Mock Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" th:href="@{/css/home/home.css}"
          href="/css/home/home.css">
</head>
<body>
<header class="site-header">
    <div class="site-header__inner">
        <div class="brand">
            <span class="brand-mark">사이 은행</span>
        </div>

        <nav class="main-nav" aria-label="주요 메뉴">
            <a data-route="main" href="/home" class="main-nav__link is-active">계좌</a>
            <a href="/transfer-history" class="main-nav__link">이체</a>
            <a href="/transactions" class="main-nav__link">내역</a>
            <span class="main-nav__link is-disabled" aria-disabled="true" title="사이원장에서 신청해주세요">서비스</span>
        </nav>

        <div class="header-tools">
            <button class="icon-button notification-button" type="button" aria-label="알림">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span></span>
            </button>
            <strong id="header-user-name" class="header-user-name" hidden></strong>
            <div class="header-profile">
                <img id="header-profile-image" alt="프로필 이미지" hidden>
                <svg id="header-profile-placeholder" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21a8 8 0 0 1 16 0"></path>
                </svg>
            </div>
        </div>
    </div>
</header>

<main class="page">
    <section class="balance-card">
        <div class="balance-card__body">
            <h2 class="balance-card__label">총 사용 가능 잔액</h2>
            <p class="balance-card__amount" id="balanceAmount">불러오는 중…</p>
        </div>
        <div class="balance-card__footer">
            <a href="/transfer" class="balance-card__cta">이체</a>
        </div>
    </section>

    <section class="transactions">
        <div class="transactions__header">
            <h3 class="transactions__title">최근 거래 내역</h3>
            <a href="/transactions" class="transactions__more">
                전체 보기
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                </svg>
            </a>
        </div>

        <div class="transactions__table" role="table">
            <div class="tx-row tx-row--head" role="row">
                <div class="tx-cell tx-cell--date" role="columnheader">날짜</div>
                <div class="tx-cell tx-cell--detail" role="columnheader">거래 상세 (수취인 | 계좌번호)</div>
                <div class="tx-cell tx-cell--amount" role="columnheader">금액</div>
            </div>

            <!-- JS(home.js)가 fetch 결과로 이 안에 tx-row를 동적으로 렌더링합니다 -->
            <div id="transactionsBody" class="transactions__body">
                <p class="transactions__state" id="transactionsState">불러오는 중…</p>
            </div>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="site-footer__inner">
        <span class="site-footer__brand">사이은행</span>
        <nav class="site-footer__nav" aria-label="정책 메뉴">
            <a href="#">약관</a>
            <a href="#">개인정보처리방침</a>
            <a href="#">보안</a>
            <a href="#">연락처</a>
        </nav>
    </div>
</footer>

<script th:src="@{/js/common/transaction-utils.js}" src="/js/common/transaction-utils.js"></script>
<script th:src="@{/js/home/home.js}" src="/js/home/home.js" defer></script>
</body>
</html>
