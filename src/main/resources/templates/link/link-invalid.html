<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연동 요청 오류</title>
    <style>
        body {
            font-family: "Pretendard", -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f6f5fb;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px 32px;
            max-width: 360px;
            text-align: center;
        }
        .icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #fdecec;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        h1 {
            font-size: 18px;
            color: #191b23;
            margin: 0 0 8px;
        }
        p {
            font-size: 14px;
            color: #6b6f7a;
            line-height: 1.6;
            margin: 0 0 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            background: #191b23;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            background: #33353f;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">⏱️</div>
    <h1>연동 요청이 만료되었습니다</h1>
    <button type="button" class="btn" id="close-btn">창 닫기</button>
    <a href="/home" class="btn" id="home-link" style="display:none; text-decoration:none; text-align:center;">메인으로 이동</a>
</div>
<script>
    (function () {
        var closeBtn = document.getElementById('close-btn');
        var homeLink = document.getElementById('home-link');
        var openedByScript = !!window.opener;

        if (openedByScript) {
            closeBtn.addEventListener('click', function () {
                window.close();
            });
        } else {
            closeBtn.style.display = 'none';
            homeLink.style.display = 'inline-flex';
        }
    })();
</script>
</body>
</html>
