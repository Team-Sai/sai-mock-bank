<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이 뱅크 | 계좌 연결</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" th:href="@{/css/common/header.css}"
          href="/css/common/header.css">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}"
          href="/css/common/footer.css">
    <link rel="stylesheet"
          th:href="@{/css/link/link-select.css}"
          href="/css/link/link-select.css">
</head>
<body>
<header th:replace="~{fragments/header :: header(activeRoute='link-select')}"></header>
<main class="link-select-main">
    <div class="request-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path>
            <path d="m9 12 2 2 4-4"></path>
        </svg>
        사이원장에서 계좌 연결을 요청했습니다
    </div>
    <h1 class="link-select-title">연결할 계좌를 선택해주세요</h1>
    <p class="link-select-subtitle">보유하신 계좌 중 연결할 계좌를 선택해주세요.</p>
    <div id="account-select-error" class="link-select-error" hidden></div>
    <div id="account-select-list" class="account-select-list"></div>
    <label class="link-select-agree">
        <input type="checkbox" id="link-select-agree-checkbox">
        <span>선택한 계좌의 조회 권한 제공에 동의합니다.</span>
    </label>
    <div class="link-select-actions">
        <button type="button" class="link-select-btn link-select-btn-secondary" id="link-select-cancel">
            취소
        </button>
        <button type="button" class="link-select-btn link-select-btn-primary" id="link-select-confirm" disabled>
            동의하고 연결
        </button>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/link/link-select.js}" src="/js/link/link-select.js" defer></script>
</body>
</html>
