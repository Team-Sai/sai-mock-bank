<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>거래내역 조회 · 사이원장 Mock Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" th:href="@{/css/transfer/transfer-history.css}"
          href="/css/transfer/transfer-history.css">
</head>
<body>
<header class="top-header">
    <nav class="breadcrumb">
        <a data-route="main" href="/home">메인</a>
        <span>›</span>
        <strong>거래내역 조회</strong>
    </nav>
    <div class="header-tools">
        <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input type="search" placeholder="검색어 입력">
        </label>
        <button class="icon-button notification-button" type="button" aria-label="알림">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span></span>
        </button>
        <strong id="header-user-name" class="header-user-name"></strong>
        <div class="header-profile">
            <img id="header-profile-image" alt="프로필 이미지" hidden>
            <svg id="header-profile-placeholder" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
        </div>
    </div>
</header>
<div class="page">
    <header class="page-header">
        <div class="brand">
            <span class="brand-mark">사이</span>
            <span class="brand-sub">MOCK BANK</span>
        </div>
        <h1>거래내역 조회</h1>
        <p class="page-desc">이체 번호로 과거 이체 건의 처리 결과를 확인합니다.</p>
    </header>

    <main class="single">
        <section class="panel" aria-labelledby="result-title">
            <div class="panel-head">
                <h2 id="result-title">이체 번호로 조회</h2>
            </div>

            <div class="lookup">
                <label for="lookup-id">이체 번호</label>
                <div class="lookup-row">
                    <input
                            type="text"
                            inputmode="numeric"
                            id="lookup-id"
                            class="mono"
                            placeholder="이체 번호 입력"
                            autocomplete="off"
                    />
                    <button type="button" id="lookup-btn" class="btn-secondary">조회</button>
                </div>
            </div>

            <div id="result-empty" class="result-empty">
                <p>이체 번호를 입력하고 조회하면<br />여기에 영수증이 표시됩니다.</p>
            </div>

            <div id="result-slip" class="slip" hidden>
                <div class="slip-status" id="slip-status">이체 완료</div>
                <dl class="slip-rows">
                    <div class="slip-row">
                        <dt>이체 번호</dt>
                        <dd class="mono" id="slip-id">—</dd>
                    </div>
                    <div class="slip-row">
                        <dt>출금 계좌</dt>
                        <dd class="mono" id="slip-from">—</dd>
                    </div>
                    <div class="slip-row">
                        <dt>입금 계좌</dt>
                        <dd class="mono" id="slip-to">—</dd>
                    </div>
                    <div class="slip-row slip-row-amount">
                        <dt>이체 금액</dt>
                        <dd class="mono amount" id="slip-amount">—</dd>
                    </div>
                    <div class="slip-row" id="slip-failure-row" hidden>
                        <dt>실패 사유</dt>
                        <dd id="slip-failure-reason">—</dd>
                    </div>
                    <div class="slip-row">
                        <dt>처리 일시</dt>
                        <dd class="mono" id="slip-date">—</dd>
                    </div>
                </dl>
                <div class="slip-perforation" aria-hidden="true"></div>
                <div class="slip-footer">사이원장 · MOCK BANK 발행 영수증</div>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/transfer/transfer-history.js}" src="/js/transfer/transfer-history.js" defer></script>
</body>
</html>
