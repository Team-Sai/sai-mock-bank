<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>거래내역 조회 · 사이원장 Mock Bank</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" th:href="@{/css/common/header.css}"
          href="/css/common/header.css">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}"
          href="/css/common/footer.css">
    <link rel="stylesheet" th:href="@{/css/transfer/transfer-history.css}"
          href="/css/transfer/transfer-history.css">
</head>
<body>
<header th:replace="~{fragments/header :: header(activeRoute='transfer-history')}"></header>
<div class="page">
    <div class="section-header">
        <h1 class="page-title">거래내역 조회</h1>
        <a href="/home" class="back-link">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
            </svg>
            메인으로
        </a>
    </div>
    <p class="page-desc">이체 번호로 과거 이체 건의 처리 결과를 확인합니다.</p>

    <main class="single">
        <section class="panel" aria-labelledby="result-title">
            <div class="panel-head">
                <h2 id="result-title">이체 번호로 조회</h2>
            </div>
            <div class="lookup">
                <label for="lookup-id">이체 번호</label>
                <div class="lookup-row">
                    <input
                            type="text"
                            inputmode="numeric"
                            id="lookup-id"
                            class="mono"
                            placeholder="이체 번호 입력"
                            autocomplete="off"
                    />
                    <button type="button" id="lookup-btn" class="btn-secondary">조회</button>
                </div>
            </div>
            <div id="result-empty" class="result-empty">
                <p>이체 번호를 입력하고 조회하면<br />여기에 영수증이 표시됩니다.</p>
            </div>
            <div id="result-slip" class="slip" hidden>
                <div class="slip-status" id="slip-status">이체 완료</div>
                <dl class="slip-rows">
                    <div class="slip-row">
                        <dt>이체 번호</dt>
                        <dd class="mono" id="slip-id">—</dd>
                    </div>
                    <div class="slip-row">
                        <dt>출금 계좌</dt>
                        <dd class="mono" id="slip-from">—</dd>
                    </div>
                    <div class="slip-row">
                        <dt>입금 계좌</dt>
                        <dd class="mono" id="slip-to">—</dd>
                    </div>
                    <div class="slip-row slip-row-amount">
                        <dt>이체 금액</dt>
                        <dd class="mono amount" id="slip-amount">—</dd>
                    </div>
                    <div class="slip-row" id="slip-failure-row" hidden>
                        <dt>실패 사유</dt>
                        <dd id="slip-failure-reason">—</dd>
                    </div>
                    <div class="slip-row">
                        <dt>처리 일시</dt>
                        <dd class="mono" id="slip-date">—</dd>
                    </div>
                </dl>
                <div class="slip-perforation" aria-hidden="true"></div>
                <div class="slip-footer">사이원장 · MOCK BANK 발행 영수증</div>
            </div>
        </section>
    </main>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/transfer/transfer-history.js}" src="/js/transfer/transfer-history.js" defer></script>
</body>
</html>
