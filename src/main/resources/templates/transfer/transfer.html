<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이체 · 사이원장 Mock Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" th:href="@{/css/transfer/transfer.css}"
          href="/css/transfer/transfer.css">
</head>
<body>
<header class="top-header">
    <nav class="breadcrumb">
        <a data-route="main" href="/home">메인</a>
        <span>›</span>
        <strong>이체</strong>
    </nav>
    <div class="header-tools">
        <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input type="search" placeholder="검색어 입력">
        </label>
        <button class="icon-button notification-button" type="button" aria-label="알림">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span></span>
        </button>
        <strong id="header-user-name" class="header-user-name"></strong>
        <div class="header-profile">
            <img id="header-profile-image" alt="프로필 이미지" hidden>
            <svg id="header-profile-placeholder" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
        </div>
    </div>
</header>
<div class="page">
    <header class="page-header">
        <div class="brand">
            <span class="brand-mark">사이뱅크</span>
        </div>
        <h1>계좌 이체</h1>
        <p class="page-desc">받는 분 계좌로 원하는 금액을 송금합니다.</p>
    </header>

    <main class="single">
        <section class="panel" aria-labelledby="transfer-form-title">
            <div class="panel-head">
                <h2 id="transfer-form-title">이체 실행</h2>
            </div>

            <form id="transfer-form" class="form" novalidate>
                <input type="hidden" id="requestKey" name="requestKey" />

                <div class="field-row">
                    <div class="field">
                        <label for="fromAccountId">출금 계좌</label>
                        <select
                                id="fromAccountId"
                                name="fromAccountId"
                                class="mono"
                                required
                                disabled
                        >
                            <option value="">계좌 불러오는 중…</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="toAccountNumber">받는 분 계좌번호</label>
                        <input
                                type="text"
                                id="toAccountNumber"
                                name="toAccountNumber"
                                class="mono"
                                placeholder="110-123-456789"
                                autocomplete="off"
                                required
                        />
                        <p class="field-hint" id="toAccountPreview"></p>
                    </div>
                </div>

                <div class="field">
                    <label for="amount">이체 금액</label>
                    <div class="amount-input">
                        <input
                                type="text"
                                inputmode="numeric"
                                id="amount"
                                name="amount"
                                class="mono"
                                placeholder="0"
                                autocomplete="off"
                                required
                        />
                        <span class="unit">원</span>
                    </div>
                </div>
                <div class="field">
                    <label for="senderMemo">보내는 분 메모 <span class="optional">선택</span></label>
                    <input
                            type="text"
                            id="senderMemo"
                            name="senderMemo"
                            placeholder="예: 8월 정산금"
                            autocomplete="off"
                            maxlength="50"
                    />
                </div>
                <div class="field">
                    <label for="receiverMemo">받는 분 메모 <span class="optional">선택</span></label>
                    <input
                            type="text"
                            id="receiverMemo"
                            name="receiverMemo"
                            placeholder="예: 사이원장 정산"
                            autocomplete="off"
                            maxlength="50"
                    />
                </div>

                <div id="form-error" class="form-error" role="alert" hidden></div>
                <div id="form-success" class="form-success" hidden>
                    <p id="form-success-text"></p>
                    <a id="form-success-link" href="#" class="form-success-link">상세 내역 보기 →</a>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">
                    <span class="btn-label">이체하기</span>
                </button>
            </form>
        </section>
    </main>
</div>
<script th:src="@{/js/transfer/transfer.js}" src="/js/transfer/transfer.js" defer></script>
</body>
</html>
