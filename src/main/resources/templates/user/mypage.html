<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이뱅크 | 내 정보</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          th:href="@{/css/user/mypage.css}"
          href="/css/user/mypage.css">
    <link rel="stylesheet" href="/css/common/header.css" th:href="@{/css/common/header.css}">
    <link rel="stylesheet" href="/css/common/account-create.css" th:href="@{/css/common/account-create.css}">
    <script src="/js/home/account-create.js" th:src="@{/js/home/account-create.js}" defer></script>
</head>
<script th:src="@{/js/user/mypage.js}"
        src="/js/user/mypage.js"
        defer></script>
<body>
<header th:replace="~{fragments/header :: header(activeRoute='mypage')}"></header>

<main class="mypage-main">
    <section class="page-title">
        <h1>내 정보</h1>
    </section>

    <div id="mypage-error" class="mypage-error" hidden></div>

    <section class="profile-card">
        <div class="profile-image-wrap">
            <div class="profile-image">
                <img id="profile-image" alt="프로필 이미지" hidden>
                <svg id="profile-placeholder"
                     viewBox="0 0 24 24"
                     aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21a8 8 0 0 1 16 0"></path>
                </svg>
            </div>
        </div>

        <div class="profile-content">
            <div class="profile-name-row">
                <strong id="member-name" class="empty-value profile-name"></strong>
            </div>

            <div id="member-email"
                 class="empty-value member-email"></div>

            <div class="profile-actions">
                <button id="logout-button" type="button">로그아웃</button>
            </div>
        </div>
    </section>

    <section class="info-grid">
        <article class="info-card">
            <div class="card-header">
                <h2>보유 계좌</h2>

                <button class="add-account-button" id="createAccountButton" type="button">계좌 생성</button>
            </div>

            <div id="account-list" class="account-list" aria-live="polite">계좌를 불러오는 중…</div>
        </article>
    </section>
    <div th:replace="~{fragments/account-create :: accountCreate}"></div>
</main>
</body>
</html>
